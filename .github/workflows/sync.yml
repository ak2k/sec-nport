name: Sync N-PORT

on:
  schedule:
    # A few days into each quarter, after the SEC posts the new data set.
    - cron: "27 7 5 1,4,7,10 *"
  workflow_dispatch:
    inputs:
      quarter:
        description: "Single quarter (e.g. 2024q1); empty = all pending"
        required: false
        default: ""
      all:
        description: "Rebuild every quarter (backfill)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/sync.yml"

concurrency:
  group: sync-nport
  cancel-in-progress: false

# NOTE: SEC_USER_AGENT / HF_TOKEN use the `secrets` context, which is NOT
# available in a workflow-level `env:` — only per-job. So the env block is
# repeated on each job below. The contact email is kept a secret (masked in
# logs, never in source); github.repository supplies the public identifier and
# contains no "github" (which the SEC's WAF blocks).

jobs:
  # ── Detect which quarters need building → matrix ──────────────────────
  detect:
    runs-on: ubuntu-latest
    env:
      SEC_USER_AGENT: "${{ github.repository }} ${{ secrets.SEC_CONTACT_EMAIL }}"
      HF_REPO_ID: ${{ vars.HF_REPO_ID }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_work: ${{ steps.detect.outputs.has_work }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync
      - id: detect
        run: |
          if [ -n "${{ github.event.inputs.quarter }}" ]; then
            QUARTERS='["${{ github.event.inputs.quarter }}"]'
          elif [ "${{ github.event.inputs.all }}" = "true" ]; then
            QUARTERS=$(uv run sec-nport list --all)
          else
            QUARTERS=$(uv run sec-nport list)
          fi
          echo "matrix=$QUARTERS" >> "$GITHUB_OUTPUT"
          [ "$QUARTERS" = "[]" ] && echo "has_work=false" >> "$GITHUB_OUTPUT" || echo "has_work=true" >> "$GITHUB_OUTPUT"

  # ── Convert + upload each quarter (one job per quarter) ───────────────
  sync:
    needs: detect
    if: needs.detect.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    env:
      SEC_USER_AGENT: "${{ github.repository }} ${{ secrets.SEC_CONTACT_EMAIL }}"
      HF_REPO_ID: ${{ vars.HF_REPO_ID }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    strategy:
      fail-fast: false
      max-parallel: 3 # be polite to SEC + serialise HF commits modestly
      matrix:
        quarter: ${{ fromJSON(needs.detect.outputs.matrix) }}
    name: sync ${{ matrix.quarter }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync
      - name: Convert ${{ matrix.quarter }}
        run: uv run sec-nport sync --quarter ${{ matrix.quarter }} --no-upload
      - name: Upload Parquet to HuggingFace
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path

          from sec_nport import hf

          repo = os.environ["HF_REPO_ID"]
          token = os.environ.get("HF_TOKEN")
          hf.ensure_repo(repo, token)
          hf.upload(repo, Path("data"), token)
          PY

  # ── Regenerate the dataset card once, after all quarters land ─────────
  card:
    needs: [detect, sync]
    if: needs.detect.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    env:
      HF_REPO_ID: ${{ vars.HF_REPO_ID }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync
      - name: Write + upload dataset card
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path

          from sec_nport import card, hf

          repo = os.environ["HF_REPO_ID"]
          token = os.environ.get("HF_TOKEN")
          _ = card.write_card(repo, Path("data"))  # tables from the constant list
          hf.ensure_repo(repo, token)
          hf.upload(repo, Path("data"), token)
          PY
